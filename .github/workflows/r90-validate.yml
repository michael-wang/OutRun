name: Validate OutRun
# Full release validation and Pages deployment happen only on approved main pushes.
# Development checks remain available on demand in dev-checks.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded PR checks should not consume minutes installing the same tools.
# A main release is never cancelled by a later PR or dev push.
concurrency:
  group: outrun-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUTRUN_SITE_BASE: /${{ github.event.repository.name }}/
      OUTRUN_BROWSER: chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify unique stable release identity
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(pkg.version)) throw new Error('Public release must have stable x.y.z version');
            if (lock.version !== pkg.version || lock.packages[''].version !== pkg.version) throw new Error('Lockfile version mismatch');
            const tag = 'v' + pkg.version;
            try {
              const {data: ref} = await github.rest.git.getRef({...context.repo, ref: 'tags/' + tag});
              const target = ref.object.type === 'tag'
                ? (await github.rest.git.getTag({...context.repo, tag_sha: ref.object.sha})).data.object.sha
                : ref.object.sha;
              if (target !== context.sha) throw new Error(tag + ' already identifies different release ' + target);
              core.info(tag + ' already identifies this exact commit; safe retry.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info(tag + ' is unused and available.');
            }
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript + Vite project-site build
        run: npm run build
      - name: Full maintained unit suite, including audio/shadows/smoke/FPS gate
        run: npm test
      # GitHub's ubuntu-latest runner already ships Chrome. Avoid repeated
      # multi-minute Playwright Chromium and apt dependency downloads.
      - name: Verify system Chrome for browser smoke tests
        run: google-chrome --version
      - name: Play the project site online and offline
        run: npx playwright test tests/pwa.spec.ts
      - name: Public racing preflight — START, countdown pause, HUD and recovery
        if: github.event_name == 'pull_request'
        env:
          OUTRUN_SITE_BASE: ''
          OUTRUN_PREFLIGHT: '1'
        run: >-
          npx playwright test
          tests/race-start-desktop.spec.ts
          tests/race-pause-and-tags.spec.ts
          tests/race-recovery.spec.ts
      - name: Upload the approved branch's site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build-and-unit
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - id: publish
        uses: actions/deploy-pages@v4

  tag-release:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Annotate successfully deployed version (immutable)
        uses: actions/github-script@v7
        with:
          script: |
            const pkg = require('./package.json');
            const tag = 'v' + pkg.version;
            const owner = context.repo.owner, repo = context.repo.repo;
            try {
              const {data: ref} = await github.rest.git.getRef({owner,repo,ref:'tags/'+tag});
              const sha = ref.object.type === 'tag'
                ? (await github.rest.git.getTag({owner,repo,tag_sha:ref.object.sha})).data.object.sha
                : ref.object.sha;
              if (sha !== context.sha) throw new Error('Tag belongs to another commit: '+tag);
              core.info('Existing '+tag+' matches deployed commit: '+context.sha);
              return;
            } catch(error) {
              if (error.status !== 404) throw error;
            }
            const {data: annotated} = await github.rest.git.createTag({
              owner,repo,tag,message:'OutRun '+tag+' — verified GitHub Pages release',
              object:context.sha,type:'commit',
              tagger:{name:'OutRun Release Bot',email:'release-bot@users.noreply.github.com',date:new Date().toISOString()}
            });
            await github.rest.git.createRef({owner,repo,ref:'refs/tags/'+tag,sha:annotated.sha});
            core.info('Created annotated '+tag+' for '+context.sha);
