name: Dev checks (manual)

# Dev pushes never launch builds or deployments. Use this lightweight workflow
# only on demand; full regression suites remain available locally.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outrun-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: P0 road and startup safety
        run: npm run test:p0
      - name: P1 serious race risks (advisory)
        id: critical
        continue-on-error: true
        run: npm run test:p1
      - name: Show critical warnings to the owner
        if: steps.critical.outcome == 'failure'
        run: |
          echo "::warning title=P1 Critical::Check critical race diagnostics before deciding to release."
          echo "⚠️ P1 diagnostics failed. Investigate and report to the owner." >> "$GITHUB_STEP_SUMMARY"

  # This job runs ONLY when the existing dev-checks workflow is manually
  # dispatched. It does not enable CI for dev pushes or P0 branch pushes.
  p0-pipeline:
    name: P0 manifest / portability / task contracts (Linux, manual only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Asset metadata and exact-byte verification
        run: npm run assets:check
      - name: Asset manifest tests
        run: npm run assets:test
      - name: POSIX path, symlink and LF portability tests
        run: node --test scripts/test-asset-manifest-portability.mjs
      - name: Research vs production task-contract tests
        run: node --test scripts/test-task-contract.mjs
