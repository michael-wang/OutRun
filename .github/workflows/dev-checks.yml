name: Dev checks (manual)

# Dev pushes never launch builds or deployments. Use this lightweight workflow
# only on demand; full regression suites remain available locally.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outrun-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: P0 road and startup safety
        run: npm run test:p0
      - name: P1 serious race risks (advisory)
        id: critical
        continue-on-error: true
        run: npm run test:p1
      - name: Show critical warnings to the owner
        if: steps.critical.outcome == 'failure'
        run: |
          echo "::warning title=P1 Critical::Check critical race diagnostics before deciding to release."
          echo "⚠️ P1 diagnostics failed. Investigate and report to the owner." >> "$GITHUB_STEP_SUMMARY"
