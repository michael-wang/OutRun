<!doctype html>
<html lang="zh-Hant" data-loading="true">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="%BASE_URL%icons/coast-192.png"><link rel="apple-touch-icon" href="%BASE_URL%icons/coast-192.png">
<link rel="manifest" href="%BASE_URL%manifest.webmanifest"><meta name="theme-color" content="#171b21">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>極速漫遊</title>
<script>
  // Keep retry usable even when the entry module itself could not download.
  addEventListener('error', function (event) {
    if (event.target instanceof HTMLScriptElement && event.target.type === 'module')
      document.documentElement.dataset.bootError = 'true';
  }, true);
</script>
<link rel="stylesheet" href="/src/racing-menu.css">
</head>
<body>
<div id="app"></div>
<section id="boot" aria-label="遊戲啟動">
  <div class="cabinet-logo"><strong lang="en">OUTRUN</strong><span>極速漫遊</span></div>
  <div class="boot-meter" role="progressbar" aria-label="正在準備關卡選單"></div>
  <button id="boot-enter" type="button" hidden>點擊螢幕進入主選單 <b aria-hidden="true">»</b></button>
  <p id="boot-error" hidden>選單無法載入。<button type="button" onclick="location.reload()">重試</button></p>
  <noscript>請啟用 JavaScript 以進入遊戲。</noscript>
</section>
<section id="game-loading" hidden data-phase="loading" aria-label="關卡載入" aria-busy="true">
  <picture id="stage-art" aria-hidden="true"><source media="(orientation: portrait)"><img alt=""></picture>
  <div class="loading-copy">
    <span id="stage-loading-name"></span><h1 id="loading-title" role="status"></h1>
    <div id="stage-rotate"></div>
    <p id="loading-detail"></p>
    <div id="loading-track" role="progressbar" aria-label="關卡準備進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="loading-fill"></i></div>
    <span id="loading-percent" hidden></span><span id="loading-hint" hidden></span>
    <p id="loading-slow" hidden></p>
    <div id="startup-fallback" hidden><p id="startup-error"></p><button id="stage-retry" type="button">重試載入</button></div>
  </div>
</section>
<script type="module" src="/src/startup.ts"></script>
</body></html>
