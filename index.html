<!doctype html><html lang="zh-Hant" data-loading="true"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><link rel="icon" href="/icons/coast-192.png"/><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#123e43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>極速漫遊</title><style>
#startup-art{position:fixed;inset:0;z-index:30;pointer-events:none;background:#3ca9e9}
#startup-art img{width:100%;height:100%;object-fit:cover;object-position:40% 75%}

#game-loading{position:fixed;inset:0;z-index:10000;isolation:isolate;overflow:hidden;color:#fff4de;background:linear-gradient(155deg,#edaf75,#2c7585 52%,#102e3e);font:16px/1.6 system-ui,sans-serif}
#game-loading picture,#game-loading img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:45% 65%}
#game-loading:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#142c3a12 15%,#102a35a8 65%,#081e2cf5)}
#game-loading picture{z-index:-2}
.loading-brand{position:absolute;top:max(30px,env(safe-area-inset-top));left:7vw;margin:0;font-weight:800;letter-spacing:.18em;font-size:clamp(24px,4vw,40px);text-shadow:0 2px 15px #173f4b}
.loading-brand small{display:block;font-size:10px;font-weight:500;letter-spacing:.3em;opacity:.9}
.loading-copy{position:absolute;left:7vw;bottom:max(7vh,env(safe-area-inset-bottom));width:min(500px,86vw)}
.loading-kicker{color:#ffd19c;letter-spacing:.24em;font-size:11px;margin:0 0 10px}
.loading-copy h1{margin:0 0 12px;font-size:clamp(26px,4vw,42px);line-height:1.3;font-weight:650;letter-spacing:.05em}
#loading-detail{margin:0 0 22px;color:#d3e1e0;min-height:2em;font-size:14px}
.loading-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:.06em;margin-bottom:8px}
#loading-track{height:5px;background:#ffffff30;border-radius:5px;overflow:hidden;position:relative}
#loading-fill{display:block;height:100%;background:#ffc78e;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
#loading-track:after{content:"";position:absolute;inset:0 auto 0 0;width:35%;background:linear-gradient(90deg,transparent,#fff8,transparent);animation:loading-sweep 1.8s linear infinite;will-change:transform}
.loading-foot{display:flex;align-items:center;gap:9px;margin-top:15px;font-size:12px;color:#c2d6d8}
.loading-spinner{display:inline-block;width:12px;height:12px;border:2px solid #ffffff30;border-top-color:#ffd19c;border-radius:50%;animation:loading-spin 1s linear infinite;will-change:transform}
#loading-slow{font-size:13px;color:#ffdbac;margin:12px 0 0}
#startup-fallback{margin-top:14px;font-size:14px}
#startup-fallback p{margin:0 0 10px}
#startup-fallback button{font:inherit;color:#193a40;background:#ffcf99;border:0;border-radius:6px;padding:10px 22px;cursor:pointer}
html[data-loading=true] #app{visibility:hidden}
@keyframes loading-sweep{from{transform:translateX(-100%)}to{transform:translateX(400%)}}
@keyframes loading-spin{to{transform:rotate(360deg)}}
@media(orientation:portrait){#game-loading img{object-position:50% 50%}.loading-copy{bottom:max(8vh,env(safe-area-inset-bottom))}.loading-brand{top:max(5vh,env(safe-area-inset-top))}}
@media(orientation:landscape) and (max-height:500px){.loading-brand{top:20px;font-size:24px}.loading-copy{bottom:22px}.loading-copy h1{font-size:24px;margin-bottom:6px}#loading-detail{margin-bottom:12px}.loading-foot{margin-top:8px}}
@media(prefers-reduced-motion:reduce){#loading-track:after,.loading-spinner{animation:none}#loading-fill{transition:none}}

[hidden]{display:none!important}
</style></head><body><div id="app"></div><picture id="startup-art" aria-hidden="true"><source media="(orientation: portrait)" srcset="/ui/start-portrait.png"><img src="/ui/start-landscape.png" alt="" fetchpriority="high" decoding="async"></picture><section id="game-loading" aria-label="遊戲載入" aria-busy="true">
<picture aria-hidden="true"><source media="(orientation: portrait)" srcset="/ui/start-portrait.png"><img src="/ui/start-landscape.png" alt="" fetchpriority="high" decoding="async"></picture>
<p class="loading-brand">極速漫遊<small>TAKE THE SCENIC ROUTE</small></p>
<div class="loading-copy"><p class="loading-kicker">YOUR NEXT ROAD TRIP</p><h1 id="loading-title" role="status" aria-live="polite">正在載入遊戲</h1><p id="loading-detail">先讓風景準備好，下一段旅程即將展開。</p>
<div class="loading-meta"><span>旅程準備進度</span><span id="loading-percent">0%</span></div><div id="loading-track" role="progressbar" aria-label="旅程準備進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="loading-fill"></i></div>
<div class="loading-foot"><i class="loading-spinner" aria-hidden="true"></i><span id="loading-hint">準備完成後，即可開始駕駛</span></div><p id="loading-slow" hidden>首次準備可能需要久一點，請保持此頁開啟。</p>
<div id="startup-fallback" hidden><p id="startup-error">準備時間較長。你可以繼續等待，或重新載入。</p><button onclick="location.reload()">重新載入</button></div>
<noscript>請啟用 JavaScript，才能載入遊戲。</noscript></div></section><script type="module" src="/src/startup.ts"></script></body></html>
