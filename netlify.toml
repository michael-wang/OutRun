[build]
  command = "npm run build"
  publish = "dist"
  # Only human-approved main releases may build; dev / PR previews are ignored.
  # Netlify ignore exit 0 = skip, exit 1 = continue.
  ignore = "if [ \"$CONTEXT\" = \"production\" ] && [ \"$BRANCH\" = \"main\" ]; then exit 1; else exit 0; fi"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/generated/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=31536000, immutable"
